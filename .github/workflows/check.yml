name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --no-sync python scripts/check_repository.py
      - run: uv run --no-sync python scripts/check_public_distribution.py
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -m "not live"
      - run: uv build
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t career-scout:ci .
      - run: docker run --rm --network none career-scout:ci plan --query offline
      - run: python3 scripts/check_container.py --image career-scout:ci
      - run: python3 scripts/check_product.py --image career-scout:ci
