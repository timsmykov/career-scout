name: Feature request
description: Describe a user problem and a useful result.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and the current limitation without personal data.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired result
      description: What observable behavior would solve the problem?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
